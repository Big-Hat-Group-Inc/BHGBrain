services:
  bhgbrain:
    build: .
    # Publish to host loopback only, so even an explicitly unauthenticated mode is
    # not reachable from the LAN. Change to "3721:3721" to expose externally.
    ports:
      - "127.0.0.1:3721:3721"
    volumes:
      - bhgbrain_data:/data
    # Optional: a missing .env must not abort first run. The entrypoint provisions
    # a bearer token automatically when none is supplied.
    env_file:
      - path: .env
        required: false
    depends_on:
      qdrant:
        condition: service_healthy
        required: false
    restart: unless-stopped

  qdrant:
    # Pinned rather than :latest for reproducible builds. Verify/update the tag
    # for your deployment; this service is opt-in via the self-hosted profile.
    image: qdrant/qdrant:v1.12.4
    profiles:
      - self-hosted
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  bhgbrain_data:
  qdrant_data:
